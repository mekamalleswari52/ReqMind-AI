version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reqmind
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - 5432:5432

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    ports:
      - 8000:8000
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - 5173:5173
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  db_data:
